name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install hash-verified dependencies
        run: |
          python -m pip install --require-hashes -r backend/requirements-dev.lock
          python -m pip install --no-deps -e ./backend
      # One platform is enough: the locks are universal resolutions.
      - name: Verify the lockfiles match pyproject.toml
        if: runner.os == 'Linux'
        run: |
          python -m pip install uv
          scripts/update_locks.sh --check
      - run: ruff check backend/app backend/tests
      - run: python -m pytest -q backend/tests
      - run: bash -n scripts/*.sh
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm 10 falls back to the retired Quick Audit endpoint on bulk errors.
      - name: Install supported npm audit client
        run: npm install --global npm@11.19.1
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run check:bundle
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ralph-dashboard:ci .
      - run: bash scripts/smoke_container.sh ralph-dashboard:ci
