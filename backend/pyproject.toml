[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ralph-dashboard-backend"
version = "0.1.0"
description = "FastAPI backend for Ralph Dashboard"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "starlette>=1.3.1,<2.0",
  "uvicorn[standard]==0.38.0",
  "watchdog>=5.0,<7.0",
  "GitPython>=3.1,<4.0",
  "PyJWT>=2.14,<3.0",
  "bcrypt>=4.3,<6.0",
  "aiosqlite>=0.20,<1.0",
  "pydantic>=2.11,<3.0",
  "psutil>=5.9,<8.0",
]

[project.scripts]
ralph-loop = "app.runner:cli"
ralph-dashboard = "app.cli.dashboard:cli"
ralph-dashboard-init-user = "app.auth.setup_user:cli"

[project.optional-dependencies]
dev = [
  "ruff>=0.13,<0.15",
  "pytest>=9.0.3,<10.0",
  "httpx2>=2.13,<3.0",
  "pytest-timeout>=2.3,<3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
addopts = "-ra"
timeout = 30
testpaths = ["tests"]
